name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # dependency-cruiser declares engines ^20.12 || ^22 || >=24 and refuses to
      # run on 23.x, so the Node version here is load-bearing, not incidental.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # Every current package's typecheck script.
      - name: Typecheck
        run: bun run typecheck

      # Fails if any source file is in no tsconfig program or carries
      # @ts-nocheck — the blind spot that hid 36 errors and two live bugs.
      - name: Typecheck coverage
        run: bun run typecheck:coverage

      - name: Architecture boundaries
        run: bun run check:arch

      - name: Current product boundary
        run: bun run check:product-boundary

  test:
    name: Tests
    # Machine suites exercise native PTYs and platform process cleanup.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      # scripts/test-isolated.ts runs each file in its own process: mock.module
      # is process-global and mock.restore() does not undo it, so a bare
      # `bun test` is not a trustworthy signal.
      - name: Test
        run: bun run test:unit

      # The suite must not leave daemons, process runners or services behind.
      # Orphans reparent to PID 1 and would otherwise accumulate silently; a
      # full lifecycle harness is tracked in #121.
      - name: Assert no leaked processes
        if: always()
        run: |
          # `ps -Ao ... | grep` rather than pgrep: macOS pgrep has no -a, and
          # joining pids for `ps -p` is needlessly fragile. This form prints the
          # offending processes directly.
          leaked=$(ps -Ao pid=,ppid=,command= | grep -E 'packages/supervisor/src/(runner|process)' | grep -v grep || true)
          if [ -n "$leaked" ]; then
            echo "::error::Test run leaked processes"
            echo "$leaked"
            exit 1
          fi
          echo "No leaked processes."

  runtime-safety:
    name: Runtime safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck runtime source and tests
        run: bun run --filter '@gitspace/account-worker' --filter '@gitspace/account-machine' --filter '@gitspace/account-web' --filter '@gitspace/protocol-runtime' --filter '@gitspace/runtime-core' --filter '@gitspace/runtime-workspace-do' --filter '@gitspace/runtime-machine' --filter '@gitspace/supervisor' --filter '@gitspace/catalog' --filter '@gitspace/provider-auth' typecheck
      - name: Verify runtime and account contracts
        run: bun run --filter '@gitspace/account-worker' --filter '@gitspace/account-machine' --filter '@gitspace/account-web' --filter '@gitspace/protocol-runtime' --filter '@gitspace/runtime-core' --filter '@gitspace/runtime-workspace-do' --filter '@gitspace/runtime-machine' --filter '@gitspace/supervisor' --filter '@gitspace/catalog' --filter '@gitspace/provider-auth' --sequential test

  design-tests:
    name: Design tests
    # Visual baselines are generated on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: packages/design-tests
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run design:test
