name = "gitspace-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain
routes = [
  { pattern = "api.gitspace.sh", custom_domain = true }
]

[vars]
PORTAL_URL = "https://gitspace.sh"
MAX_ACCOUNTS = "17"
SERVE_DOMAIN = "gitspace.sh"
# GITHUB_CLIENT_ID set via wrangler secret or here for dev
# Serve routes publish exact <service>--...--<user>-srv.gitspace.sh records in the main zone.

[[d1_databases]]
binding = "DB"
database_name = "gitspace"
database_id = "54552f6a-a846-4a4c-97a9-40f185b07451"

# Managed artifacts blob storage (LFS-style split; CF git hosting has no LFS)
[[r2_buckets]]
binding = "ARTIFACT_BLOBS"
bucket_name = "gitspace-artifact-blobs"

# Secrets (set via: wrangler secret put SECRET_NAME)
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# CF_API_TOKEN
# CF_ACCOUNT_ID
# CF_ZONE_ID
# ENCRYPTION_KEY
# CF_ARTIFACTS_API_URL   (CF Artifacts REST base; unset = dev in-memory upstream)
# CF_ARTIFACTS_API_TOKEN (long-lived CF Artifacts credential; never leaves the worker)
# ARTIFACTS_GIT_BASE     (optional; default https://artifacts.gitspace.sh)
